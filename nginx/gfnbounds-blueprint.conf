# =============================================================================
# gfnbounds-blueprint.conf — the static blueprint dashboard, served by node1.
#
#   client  ->  node1:8080  (nginx, this block)  ->  /var/www/gfnbounds-blueprint
#
# Port 8080 rather than 80 on purpose. node1's :80 belongs to the `tabcl` site,
# which is `default_server` and whose source of truth is another repository —
# adding a `location` there would be silently reverted the next time that repo
# deploys. A second listener collides with nothing.
#
# UNAUTHENTICATED, at the author's instruction (2026-09-08): anyone who reaches the
# port reads everything under the root, and `noindex, nofollow` on the pages asks
# politely rather than controlling anything.
#
# It is NOT yet reachable from the internet, and that is the network's doing rather
# than this file's. 188.211.162.184 is the Huawei gateway, not node1: it forwards
# :22 to 192.168.1.200 and serves its own configurator on :80. Until 8080 is
# forwarded to 192.168.1.200:8080 there, the live addresses are
#
#   http://192.168.1.200:8080/     the LAN
#   http://10.224.72.162:8080/     the MRC-guest ZeroTier network
#
# node1's ufw already allows 8080 from anywhere, so the forward is the only step left.
# To narrow it to those two networks instead of opening it:
#   sudo ufw delete allow 8080/tcp
#   sudo ufw allow from 10.224.72.0/24 to any port 8080 proto tcp   # ZeroTier only
#   sudo ufw allow from 192.168.1.0/24 to any port 8080 proto tcp   # LAN
#
# Install on node1 (one-time; source of truth is this repo file):
#   sudo install -d -o maxbrain -g maxbrain /var/www/gfnbounds-blueprint
#   sudo cp nginx/gfnbounds-blueprint.conf /etc/nginx/sites-available/gfnbounds-blueprint
#   sudo ln -sf /etc/nginx/sites-available/gfnbounds-blueprint \
#               /etc/nginx/sites-enabled/gfnbounds-blueprint
#   sudo ufw allow 8080/tcp comment "gfnbounds blueprint"
#   sudo nginx -t && sudo systemctl reload nginx
#
# Revert:
#   sudo rm -f /etc/nginx/sites-enabled/gfnbounds-blueprint
#   sudo ufw delete allow 8080/tcp
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/gfnbounds-blueprint;
    index index.html;
    charset utf-8;
    autoindex off;

    access_log /var/log/nginx/gfnbounds-blueprint.access.log;
    error_log  /var/log/nginx/gfnbounds-blueprint.error.log;

    # REPO-INDEX is ~600 KB of HTML and the blueprint ships its own SVG sprite.
    gzip on;
    # text/html is always gzipped and must not be listed — nginx warns on the duplicate.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # The headline numbers change on every deploy; never let a proxy pin them.
    location = /status.json {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
